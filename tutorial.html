<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pilótaútmutató — Operation Falcon: Redline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #081512;
        color: #dbe6d1;
        font:
          17px/1.75 system-ui,
          sans-serif;
      }
      main {
        max-width: 820px;
        margin: auto;
        padding: 48px 24px 80px;
      }
      h1 {
        font-size: clamp(30px, 6vw, 48px);
        line-height: 1.2;
        margin: 16px 0;
      }
      h2 {
        color: #c4ef96;
        font-size: 24px;
        margin: 46px 0 12px;
      }
      h3 {
        font-size: 18px;
        color: #c4ef96;
        margin: 24px 0 8px;
      }
      p {
        margin: 12px 0;
      }
      a {
        color: #c4ef96;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        padding: 20px 0;
        border-block: 1px solid #38503a;
        margin: 28px 0;
      }
      nav a {
        font-size: 14px;
      }
      kbd {
        font:
          0.9em ui-monospace,
          monospace;
        background: #1d3024;
        border: 1px solid #527044;
        border-radius: 3px;
        padding: 1px 5px;
        white-space: nowrap;
      }
      li {
        padding: 5px 0;
      }
      strong {
        color: #f0f6e9;
      }
      .note {
        border-left: 3px solid #9bbc75;
        padding: 8px 18px;
        background: #122219;
      }
      small {
        color: #9caf99;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
      }
      td {
        vertical-align: top;
        padding: 10px 8px;
        border-bottom: 1px solid #263b2e;
      }
      td:first-child {
        width: 100px;
        color: #c4ef96;
      }
      section {
        scroll-margin-top: 20px;
      }
      @media print {
        body {
          background: white;
          color: #222;
          font-size: 11pt;
        }
        main {
          padding: 0;
        }
        h1,
        h2,
        h3,
        strong,
        td:first-child {
          color: #222;
        }
        nav,
        .back {
          display: none;
        }
        .note {
          background: transparent;
        }
        section {
          break-inside: avoid;
        }
        kbd {
          color: #222;
          background: transparent;
        }
      }
    </style>
    <link rel="stylesheet" href="/src/ui/language.css" />
  </head>
  <body>
    <header><a href="/">Operation Falcon: Redline</a></header>
    <main id="printable-guide"></main>
    <script type="module" src="/src/tutorial.js"></script>
  </body>
</html>
