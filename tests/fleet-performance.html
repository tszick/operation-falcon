<!doctype html>
<html lang="hu">
  <meta charset="utf-8" /><title>Légifölény · teljesítménymérés</title
  ><style>
    body {
      margin: 0;
      overflow: hidden;
      background: #071211;
      color: #baf37d;
      font: 14px monospace;
    }
    aside {
      position: fixed;
      top: 16px;
      left: 16px;
      background: #071211ee;
      padding: 12px;
    }
    button {
      background: #1d3528;
      color: #baf37d;
      padding: 8px;
    }
    pre {
      white-space: pre-wrap;
    }</style
  ><canvas id="world"></canvas>
  <aside>
    <button id="near">Közel</button> <button id="far">Távol</button>
    <pre id="report">Mérés...</pre>
  </aside>
  <script type="module">
    import { Renderer } from '/src/renderer.js';
    import { aircraft, missions } from '/src/aircraftSpec.js';
    import { createMissionAircraft } from '/src/missionStart.js';
    import { Vec3, Quat } from '/src/math.js';
    import { createTargets, updateTargets, Targeting } from '/src/targeting.js';
    import { Weapons } from '/src/weapons.js';
    import { Mission } from '/src/mission.js';
    let generation = 0;
    const r = new Renderer(document.getElementById('world'));
    r.debugMetrics = true;
    if (new URLSearchParams(location.search).get('backend') === 'cpu') r.gpuModels = null;
    if (new URLSearchParams(location.search).get('terrain') === 'cpu' && r.gpuModels)
      r.gpuModels.renderTerrain = () => false;
    let timing = {};
    for (const name of ['terrain', 'paintMeshes', 'skyStars', 'runway', 'hud']) {
      const fn = r[name].bind(r);
      r[name] = (...args) => {
        const start = performance.now(),
          out = fn(...args);
        timing[name] = (timing[name] || 0) + performance.now() - start;
        return out;
      };
    }
    async function run(near) {
      const generationId = ++generation,
        scenario = missions.find((m) => m.id === 'air-superiority'),
        spec = aircraft.find((a) => a.id === 'f16'),
        targets = createTargets(scenario, spec, { rng: () => 0.23 }),
        s = createMissionAircraft(spec, scenario),
        w = new Weapons({ enemyFire: true }),
        m = new Mission(scenario),
        aim = new Targeting();
      Object.assign(s, {
        position: new Vec3(0, near ? 2200 : 6000, near ? 0 : -10000),
        orientation: Quat.euler(0, near ? -0.2 : -0.1, 0),
        onGround: false,
        airborne: true,
        speed: 180,
        ias: 180,
        velocity: new Vec3(0, 0, 180),
        agl: 900,
        elapsed: 30,
        gear: false,
        flaps: false,
        flapPosition: 0,
      });
      w.enemyCombat.activeTime = 120;
      let i = 0;
      for (const t of targets.filter((t) => t.kind === 'air')) {
        t.pending = false;
        t.alive = true;
        t.aiRole = t.type === 'bomber' ? undefined : 'interceptor';
        t.position = new Vec3(
          ((i % 7) - 3) * 250,
          2200 + ((i % 3) - 1) * 120,
          near ? 900 + Math.floor(i / 7) * 750 : 15000 + Math.floor(i / 7) * 2500,
        );
        t.previousPosition = t.position.clone();
        t.heading = t.team === 'ally' ? 0 : Math.PI;
        t.velocity = new Vec3(0, 0, (t.team === 'ally' ? 1 : -1) * t.cruiseSpeed);
        i++;
      }
      if (new URLSearchParams(location.search).has('combat'))
        for (let i = 0; i < 120 * 8; i++) {
          s.elapsed += 1 / 120;
          updateTargets(targets, 1 / 120);
          w.update(s, targets, 1 / 120);
          w.drainEvents();
        }
      const samples = [];
      document.getElementById('report').textContent = 'Mérés...';
      for (let frame = 0; frame < 34; frame++) {
        await new Promise(requestAnimationFrame);
        if (generationId !== generation) return;
        const start = performance.now();
        timing = {};
        let simStart = performance.now();
        for (let j = 0; j < 2; j++) {
          s.elapsed += 1 / 120;
          updateTargets(targets, 1 / 120);
          w.update(s, targets, 1 / 120);
          m.update(s, targets, w, aim);
          w.drainEvents();
        }
        const sim = performance.now() - simStart;
        r.render(s, targets, w, aim);
        if (frame >= 4)
          samples.push({
            total: performance.now() - start,
            sim,
            features: r.featureMs,
            effects: r.effectsMs,
            ...timing,
          });
      }
      const mean = (key) =>
          +(samples.reduce((n, s) => n + (s[key] || 0), 0) / samples.length).toFixed(2),
        values = samples.map((s) => s.total).sort((a, b) => a - b);
      document.getElementById('report').textContent = JSON.stringify(
        {
          mode: near ? 'near' : 'far',
          viewport: [r.w, r.h],
          frames: samples.length,
          totalMs: mean('total'),
          simulationMs: mean('sim'),
          modelsMs: mean('paintMeshes'),
          terrainMs: mean('terrain'),
          starsMs: mean('skyStars'),
          featuresMs: mean('features'),
          effectsMs: mean('effects'),
          runwayMs: mean('runway'),
          hudMs: mean('hud'),
          p95Ms: +values[Math.floor(values.length * 0.95)].toFixed(2),
          projectiles: w.projectiles.length,
          terrain: r.terrainMetrics,
          models: r.modelMetrics,
        },
        null,
        2,
      );
    }
    document.getElementById('near').onclick = () => run(true);
    document.getElementById('far').onclick = () => run(false);
    run(new URLSearchParams(location.search).get('mode') !== 'far');
  </script>
</html>
