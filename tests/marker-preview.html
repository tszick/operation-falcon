<!doctype html>
<html lang="hu">
  <meta charset="utf-8" /><title>Célkeretek · bedöntési próba</title
  ><style>
    body {
      margin: 0;
      background: #071211;
      overflow: hidden;
      color: #baf37d;
      font: 14px monospace;
    }
    aside {
      position: fixed;
      right: 12px;
      bottom: 12px;
      background: #071211e8;
      padding: 10px;
    }
    button {
      padding: 8px;
      background: #1d3528;
      color: #baf37d;
      border: 1px solid #536a48;
    }</style
  ><canvas id="world"></canvas>
  <aside>
    <button id="level">Vízszintes</button> <button id="bank">Bedöntve</button>
    <p id="status"></p>
  </aside>
  <script type="module">
    import { Renderer } from '/src/renderer.js';
    import { createAircraft } from '/src/physics.js';
    import { aircraft } from '/src/aircraftSpec.js';
    import { Vec3, Quat } from '/src/math.js';
    import { configureTerrain } from '/src/terrain.js';
    import { Weapons } from '/src/weapons.js';
    import { Targeting } from '/src/targeting.js';
    configureTerrain({ id: 'none' }, new Vec3(45000, 0, 45000), () => 0.99);
    const s = createAircraft(aircraft[0]),
      r = new Renderer(document.getElementById('world')),
      w = new Weapons(),
      aim = new Targeting();
    Object.assign(s, {
      position: new Vec3(0, 6000, 0),
      orientation: Quat.euler(0, -0.6, 0),
      onGround: false,
      airborne: true,
      gear: false,
      flaps: false,
      flapPosition: 0,
      velocity: new Vec3(0, 0, 180),
      speed: 180,
      ias: 180,
      agl: 6000,
    });
    const targets = [
      {
        id: 'A',
        kind: 'air',
        type: 'fighter',
        aircraftId: 'su27',
        team: 'enemy',
        name: 'Szu-27',
        position: new Vec3(-3500, 1000, 30000),
      },
      {
        id: 'B',
        kind: 'air',
        type: 'fighter',
        aircraftId: 'f15',
        team: 'ally',
        radioCallSign: { flight: 'Falcon', number: 2 },
        name: 'Falcon Two',
        position: new Vec3(0, 2000, 32000),
      },
      {
        id: 'C',
        kind: 'air',
        type: 'bomber',
        aircraftId: 'tu95',
        team: 'enemy',
        name: 'Tu-95',
        position: new Vec3(3500, 500, 35000),
      },
      {
        id: 'G',
        kind: 'ground',
        type: 'bunker',
        team: 'enemy',
        name: 'Bunker',
        position: new Vec3(500, 100, 40000),
      },
    ].map((t) => ({ ...t, alive: true, velocity: new Vec3(), heading: 0 }));
    aim.id = 'C';
    aim.locked = true;
    let frames = 0,
      arrows = 0;
    const marker = r.marker.bind(r);
    r.marker = (p, label, ...rest) => {
      const out = marker(p, label, ...rest);
      if (!label.startsWith('BASE')) {
        if (out) frames++;
        else arrows++;
      }
      return out;
    };
    function draw() {
      frames = 0;
      arrows = 0;
      r.render(s, targets, w, aim);
      document.getElementById('status').textContent =
        `Célkeretek: ${frames}/4 · iránynyilak: ${arrows}`;
    }
    document.getElementById('level').onclick = () => {
      s.orientation = Quat.euler(0, -0.6, 0);
      draw();
    };
    document.getElementById('bank').onclick = () => {
      s.orientation = Quat.euler(0, -0.6, 0.65);
      draw();
    };
    draw();
    setTimeout(draw, 500);
  </script>
</html>
