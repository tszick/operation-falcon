<!doctype html><html lang="hu"><head><meta charset="utf-8"><title>Légifölény · ellenőrzés</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/flight.css"></head><body><script type="module">
import {aircraft,missions} from '/src/aircraftSpec.js';import {createMissionAircraft} from '/src/missionStart.js';import {createTargets,Targeting} from '/src/targeting.js';import {Mission} from '/src/mission.js';import {Weapons} from '/src/weapons.js';import {Renderer} from '/src/renderer.js';import {updateHUD} from '/src/hud.js';import {postRadioMessage} from '/src/flightMessages.js';import {wingmanLine} from '/src/wingmanRadio.js';
const doc=new DOMParser().parseFromString(await(await fetch('/')).text(),'text/html');for(const sel of ['#world','header','#flight-ui'])document.body.append(doc.querySelector(sel));document.body.classList.add('flying','guide-open');document.getElementById('flight-ui').hidden=false;
const spec=aircraft.find(a=>a.id==='f16'),scenario=missions.find(m=>m.id==='air-superiority'),targets=createTargets(scenario,spec,{rng:()=>.5}),s=createMissionAircraft(spec,scenario),w=new Weapons({enemyFire:true}),m=new Mission(scenario),aim=new Targeting();const lock=new URLSearchParams(location.search).get('lock');if(lock){aim.id=targets.find(t=>t.team==='enemy'&&t.kind==='air').id;aim.locked=lock==='locked';aim.progress=aim.locked?2:1;}m.update(s,targets,w);updateHUD(s,targets,w,aim,m,true);for(const [i,flight]of ['Ironfist','Viper'].entries())postRadioMessage(wingmanLine('wingmanReady',1,'ALLY'+i,flight),0);updateHUD(s,targets,w,aim,m,true);new Renderer(document.getElementById('world')).render(s,targets,w,aim);
