<!doctype html><html lang="hu"><head><meta charset="utf-8"><title>Terep és jelzavarás ellenőrzése</title><link rel="stylesheet" href="/style.css"><style>#demo{position:fixed;top:84px;left:24%;max-width:58%;z-index:10;background:#081610eb;border:1px solid #729553;padding:8px;font:10px monospace;color:#c9ec9d}#demo button{font:10px monospace;background:#24391e;border:1px solid #729553;color:#c9ec9d;padding:7px;margin:2px}#demo-result{display:block;margin-top:4px}</style></head><body><div id="demo"><button data-scene="convoy">Konvoj</button><button data-scene="bridge">Híd</button><button data-scene="bunker">Bunker</button><button data-scene="sam">Üteg</button><button data-scene="sam-system">Rakétarendszer</button><button data-scene="radar">Radar</button><button data-scene="airbase">Reptér</button><button id="fire-test">Indítás próba</button><button id="river-view">Folyó magasból</button><button id="angle-test">Indítási szög próba</button><button id="road-view">Út közelről</button><button id="near">Zavarási körbe</button><button id="far">Körön kívülre</button><button id="kill">Zavaró megsemmisítése</button><span id="demo-result"></span></div><script type="module">
import {aircraft,missions} from '/src/aircraftSpec.js';import {Vec3,Quat} from '/src/math.js';import {createAircraft} from '/src/physics.js';import {createTargets,updateTargets,Targeting} from '/src/targeting.js';import {Weapons} from '/src/weapons.js';import {Renderer} from '/src/renderer.js';import {Mission} from '/src/mission.js';import {updateHUD} from '/src/hud.js';import {terrainHeight,terrainWorld,pathPoint} from '/src/terrain.js';import {navigationJammed} from '/src/electronicWarfare.js';
const source=new DOMParser().parseFromString(await(await fetch('/')).text(),'text/html');for(const selector of ['#world','header','#flight-ui'])document.body.append(source.querySelector(selector));document.body.classList.add('flying','guide-open');for(const id of ['flight-ui','fuel-status'])document.getElementById(id).hidden=false;
const renderer=new Renderer(document.getElementById('world'));let s,targets,w,aim,m,last=performance.now();
function move(near){const target=targets.find(t=>t.type==='jammer')||targets[0],d=near?650:9000;s.position=target.position.clone().add(new Vec3(0,near?180:1100,-d));s.orientation=Quat.euler(0,Math.atan2(target.position.y-s.position.y,d),0);s.agl=s.position.y-terrainHeight(s.position.x,s.position.z);s.velocity=new Vec3(0,0,140);s.landingMode='off';aim.cycle(s,targets);aim.update(s,targets,3);}
function reset(id){let seed=427365;const rng=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};const spec=missions.find(m=>m.id===id);s=createAircraft(aircraft.find(a=>a.id==='f16'));targets=createTargets(spec,s.spec,{rng});s.onGround=false;s.airborne=true;s.gear=false;s.flaps=false;s.flapPosition=0;s.speed=s.ias=140;w=new Weapons();w.selected='agm';aim=new Targeting();m=new Mission(spec);move(false);}
document.getElementById('fire-test').onclick=()=>{document.getElementById('flight-toast').textContent=w.fire(s,targets,aim)||'';};
document.getElementById('river-view').onclick=()=>{reset('bridge');const path=terrainWorld.river,b=pathPoint(path,-10000),a=b.clone().add(new Vec3(-Math.sin(path.angle)*6000,6759,Math.cos(path.angle)*6000));b.y=path.level;a.y+=path.level;s.position=a;s.orientation=Quat.euler(Math.atan2(b.x-a.x,b.z-a.z),Math.atan2(b.y-a.y,Math.hypot(b.x-a.x,b.z-a.z)),0);s.agl=a.y-terrainHeight(a.x,a.z);};
document.getElementById('angle-test').onclick=()=>{move(false);const target=targets.find(t=>t.type==='jammer')||targets[0],d=target.position.clone().sub(s.position);s.orientation=Quat.euler(Math.atan2(d.x,d.z)+55*Math.PI/180,0,0);};
document.getElementById('road-view').onclick=()=>{const path=terrainWorld.road;if(!path)return;const a=pathPoint(path,-300),b=pathPoint(path,450);a.y=terrainHeight(a.x,a.z)+85;b.y=terrainHeight(b.x,b.z);s.position=a;s.orientation=Quat.euler(Math.atan2(b.x-a.x,b.z-a.z),Math.atan2(b.y-a.y,Math.hypot(b.x-a.x,b.z-a.z)),0);s.agl=85;};
for(const b of document.querySelectorAll('[data-scene]'))b.onclick=()=>reset(b.dataset.scene);document.getElementById('near').onclick=()=>move(true);document.getElementById('far').onclick=()=>move(false);document.getElementById('kill').onclick=()=>{const j=targets.find(t=>t.type==='jammer'&&t.alive);if(j){j.alive=false;w.explode(j.position,'bomb',{ground:true});}};addEventListener('resize',()=>renderer.resize());
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;s.elapsed+=dt;updateTargets(targets,dt);aim.update(s,targets,dt);w.update(s,targets,dt);m.update(s,targets,w,aim);renderer.render(s,targets,w,aim);updateHUD(s,targets,w,aim,m,true);document.getElementById('demo-result').textContent=`${navigationJammed(s,targets)?'ZAVART':'TISZTA'} · ${targets.filter(t=>t.alive).length} aktív objektum · ${aim.locked?'BEFOGVA':'NINCS BEFOGÁS'}`;requestAnimationFrame(frame);}reset('convoy');requestAnimationFrame(frame);
</script></body></html>
