<!doctype html><html lang="hu"><meta charset="utf-8"><title>Operation Falcon — rádiópróba</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/flight.css"><style>body{padding:24px;font:14px Consolas,monospace}h1{font:24px Consolas,monospace}#clips{max-width:62%;max-height:75vh;overflow:auto;display:grid;gap:6px}#clips button{text-align:left;padding:8px;border:1px solid #45613b;background:#0b2117;color:#baf37d;font:13px/1.4 Consolas,monospace}#controls button{padding:8px;margin:0 8px 10px 0;background:#172d20;color:#dbeda9;border:1px solid #45613b}#status{font-size:12px;color:#a6dce5}body.flying #combat-messages{bottom:30px}body.flying #flight-message-feed{inset:0}</style><body class="flying"><h1>RADIO CHECK · Operation Falcon: Redline</h1><p>A választott mondat valódi, előre elkészített hangfájlból szól; felirata balra jelenik meg.</p><div id="controls"><button id="urgent">SAM-riasztás · megszakítás próba</button><button id="mute-radio">Némítás</button><button id="stop-radio">Leállítás</button></div><p id="status">Válassz egy rádiószöveget.</p><div id="clips"></div><div id="combat-messages"></div><script type="module">
import {RadioComms} from '/src/radioComms.js';import {radioLines} from '/src/radioLines.js';import {postRadioMessage,updateFlightMessages,resetFlightMessages} from '/src/flightMessages.js';import {Vec3} from '/src/math.js';
const radio=new RadioComms(),s={elapsed:0,airborne:false,onGround:true,damage:0,position:new Vec3(),velocity:new Vec3(),spec:{faction:'nato'}},mission={spec:{objective:'battle'},phaseId:'preflight'};let muted=false,last=performance.now();
radio.onLine=(line,now)=>postRadioMessage(line,now);
async function init(){if(!radio.ctx){const ctx=new AudioContext();radio.attach(ctx);}await radio.ctx.resume();}
for(const line of radioLines){const b=document.createElement('button');b.dataset.line=line.id;b.textContent=`${line.speaker.toUpperCase()} · ${line.text}`;b.onclick=async()=>{await init();radio.reset();resetFlightMessages();radio.director.queue.push({line,key:line.id,priority:40,ready:s.elapsed,expires:s.elapsed+30});};document.getElementById('clips').append(b);}
document.getElementById('urgent').onclick=async()=>{await init();radio.director.issue('sam',s.elapsed,{priority:100});};document.getElementById('mute-radio').onclick=()=>{muted=!muted;radio.setMuted(muted);document.getElementById('mute-radio').textContent=muted?'Hang vissza':'Némítás';};document.getElementById('stop-radio').onclick=()=>{radio.reset();resetFlightMessages();};
function frame(now){s.elapsed+=(now-last)/1000;last=now;radio.update(s,mission,[],{muted,active:true});updateFlightMessages(s,{state:'clear',label:'RÁDIÓPRÓBA',hint:'',solution:null},{id:null},{selected:'aam'});document.getElementById('status').textContent=`Audio: ${radio.ctx?.state||'készenlét'} · Betöltve: ${radio.buffers.size}/${radioLines.length} · Hibás: ${radio.failed.size} · Most: ${radio.current?.cue.line.id||'—'}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
