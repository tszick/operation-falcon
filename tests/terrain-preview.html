<!doctype html>
<html lang="hu">
  <meta charset="utf-8" /><title>Tömör terep és céltakarás</title
  ><style>
    body {
      margin: 0;
      overflow: hidden;
      background: #071211;
      color: #baf37d;
      font: 14px monospace;
    }
    canvas {
      display: block;
    }
    aside {
      position: fixed;
      left: 20px;
      top: 20px;
      background: #081610dd;
      padding: 10px;
    }
    button {
      background: #1d3528;
      color: #baf37d;
      border: 1px solid #729553;
      padding: 8px;
    }</style
  ><canvas id="world"></canvas>
  <aside>
    <button id="low">Hegy mögötti cél</button> <button id="high">Hegy fölötti nézet</button>
    <p id="result"></p>
  </aside>
  <script type="module">
    import { Renderer } from '/src/renderer.js';
    import { configureTerrain, terrainWorld } from '/src/terrain.js';
    import { Vec3, Quat } from '/src/math.js';
    import { aircraft } from '/src/aircraftSpec.js';
    import { createAircraft } from '/src/physics.js';
    import { Weapons } from '/src/weapons.js';
    import { Targeting } from '/src/targeting.js';
    configureTerrain({ id: 'none' }, new Vec3(22000, 0, 0), () => 0.99);
    terrainWorld.peaks.push({ x: 12000, z: 3000, height: 1800, radius: 1700, platform: 0 });
    const r = new Renderer(document.getElementById('world')),
      s = createAircraft(aircraft[0]),
      aim = new Targeting(),
      weapons = new Weapons();
    const target = {
      id: 'behind-ridge',
      kind: 'air',
      aircraftId: 'mig29',
      name: 'HEGY MÖGÖTTI CÉL',
      alive: true,
      position: new Vec3(12000, 600, 6000),
      heading: 0,
      team: 'enemy',
      radius: 15,
    };
    aim.id = target.id;
    aim.locked = true;
    s.onGround = false;
    s.airborne = true;
    s.gear = false;
    s.flaps = false;
    s.flapPosition = 0;
    s.speed = s.ias = 140;
    s.velocity = new Vec3(0, 0, 140);
    function view(high) {
      s.position = new Vec3(12000, high ? 4000 : 600, 0);
      s.orientation = Quat.euler(0, high ? -0.3 : 0, 0);
      s.agl = s.position.y;
      const start = performance.now();
      r.render(s, [target], weapons, aim);
      document.getElementById('result').textContent =
        `Fizikai cél: ${r.worldVisible(target.position) ? 'látható' : 'hegy takarja'} · HUD-keret: megmarad · rajzolás: ${Math.round(performance.now() - start)} ms`;
    }
    document.getElementById('low').onclick = () => view(false);
    document.getElementById('high').onclick = () => view(true);
    view(false);
  </script>
</html>
