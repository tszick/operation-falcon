<!doctype html>
<html lang="hu">
  <meta charset="utf-8" /><title>Operation Falcon · Tengeri repülési próba</title
  ><style>
    body {
      margin: 0;
      background: #173446;
      color: white;
      font: 14px system-ui;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    header {
      position: absolute;
      inset: 0 0 auto;
      padding: 12px;
      background: #0b1b2ded;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    button,
    select {
      font: inherit;
      background: #253e4a;
      color: white;
      border: 1px solid #7b959e;
      padding: 7px;
    }
    pre {
      position: absolute;
      left: 15px;
      bottom: 5px;
      max-width: 650px;
      max-height: 220px;
      overflow: auto;
      background: #071416dd;
      padding: 12px;
      font: 12px monospace;
      white-space: pre-wrap;
    }
    footer {
      position: absolute;
      right: 15px;
      bottom: 12px;
      text-shadow: 1px 1px #000;
    }</style
  ><canvas id="world"></canvas>
  <header>
    <b>SEA GUARD · HANG NÉLKÜLI PRÓBA</b
    ><select id="mode" aria-label="Próbajelenet">
      <option value="overview">Anyahajó · külső nézet</option>
      <option value="battle">Fedélzet és támadók</option>
      <option value="catapult">Katapultos indulás</option>
      <option value="trap">Kötélfogás</option>
      <option value="bolter">Elvétett kötél · bolter</option>
      <option value="harrier-light">Harrier · könnyű VTO</option>
      <option value="harrier-heavy">Harrier · túl nehéz VTO</option>
      <option value="harrier-land">Harrier · függőleges leszállás</option>
      <option value="destroyer">Ellenséges romboló</option>
      <option value="harrier-model">Harrier modell</option></select
    ><button id="advance">8 s repülés</button><button id="all">Összes repülési próba</button
    ><button id="combat">180 s harci próba</button>
  </header>
  <pre id="report">Nincs hangrendszer vagy beszéd betöltve.</pre>
  <footer id="status"></footer>
  <script type="module">
    import { navalScenario, advanceNaval } from './navalScenarios.js';
    import { Renderer, aircraftMesh } from '/src/renderer.js';
    import { Vec3, Quat, attitude, clamp } from '/src/math.js';
    import { renderEnvironmentSky } from '/src/environmentSky.js';
    import { renderTerrainFeatures } from '/src/terrainFeatures.js';
    import { renderCarrier } from '/src/carrierVisuals.js';
    import { renderGroundTarget } from '/src/groundModels.js';
    import { stepAircraft } from '/src/physics.js';
    import { updateTargets } from '/src/targeting.js';
    import { requestCatapult } from '/src/navalOps.js';
    import { mass, atmosphere } from '/src/performance.js';
    const $ = (id) => document.getElementById(id),
      r = new Renderer($('world'));
    r.surfaceMode = 'ocean';
    r.surfaceLines = false;
    let x = navalScenario(),
      results = [];
    function look(camera, p) {
      const d = p.clone().sub(camera);
      r.setup(camera, Quat.euler(Math.atan2(d.x, d.z), Math.atan2(d.y, Math.hypot(d.x, d.z)), 0));
    }
    function draw() {
      const mode = $('mode').value;
      if (['overview', 'destroyer', 'harrier-model'].includes(mode)) {
        if (mode === 'overview') look(new Vec3(-230, 145, -270), new Vec3(0, 12, 0));
        if (mode === 'destroyer')
          look(new Vec3(10000 - 150, 90, 15000 + 140), new Vec3(10000, 10, 15000));
        if (mode === 'harrier-model') look(new Vec3(12, 7, 13), new Vec3(0, 0, 0));
        renderEnvironmentSky(r);
        r.groundHorizon();
        r.worldOcclusion = true;
        r.meshQueue = [];
        r.terrain();
        renderTerrainFeatures(r);
        if (mode === 'overview') renderCarrier(r);
        else if (mode === 'destroyer')
          renderGroundTarget(
            r,
            x.targets.find((t) => t.type === 'destroyer'),
          );
        else
          r.mesh(
            aircraftMesh('harrier'),
            new Vec3(0, 3, 0),
            new Quat(),
            1,
            '#aeb9c0',
            null,
            'aircraft',
          );
        r.flushMeshes();
      } else r.render(x.s, x.targets, x.w, x.aim);
      $('status').textContent =
        `Valódi játékbeli modellek és fizika · ${r.gpuModels?.name || 'Canvas2D'} · nincs hang`;
    }
    function summary(x) {
      return {
        mode: x.mode,
        time: +x.s.elapsed.toFixed(2),
        position: Object.fromEntries(
          Object.entries(x.s.position).map(([k, v]) => [k, +v.toFixed(2)]),
        ),
        speedKmh: +(x.s.speed * 3.6).toFixed(1),
        fuelKg: +x.s.fuel.toFixed(1),
        naval: x.s.naval,
        onGround: x.s.onGround,
        airborne: x.s.airborne,
        crashed: x.s.crashed,
        landing: x.s.landing,
        damage: x.s.damage,
      };
    }
    $('mode').onchange = () => {
      x = navalScenario($('mode').value);
      draw();
      $('report').textContent = JSON.stringify(summary(x), null, 2);
    };
    $('advance').onclick = () => {
      advanceNaval(x, 8, { combat: false });
      draw();
      $('report').textContent = JSON.stringify(summary(x), null, 2);
    };
    $('all').onclick = () => {
      results = [
        'catapult',
        'trap',
        'bolter',
        'harrier-light',
        'harrier-heavy',
        'harrier-land',
      ].map((mode) => {
        const c = navalScenario(mode);
        advanceNaval(c, 8, { combat: false });
        return summary(c);
      });
      $('report').textContent = JSON.stringify({ physicsFlights: results }, null, 2);
    };
    $('combat').onclick = () => {
      x = navalScenario('battle');
      x.s.elapsed = 5;
      x.s.throttle = 1;
      requestCatapult(x.s);
      const events = [],
        start = performance.now();
      for (let i = 0; i < 180 * 120 && !x.s.crashed && !x.m.failed; i++) {
        const s = x.s,
          a = attitude(s.orientation),
          v = Math.max(40, s.speed),
          air = atmosphere(s.position.y),
          cl = (mass(s) * 9.81) / (0.5 * air.density * v * v * s.spec.wingArea),
          alpha = clamp((cl - 0.22 - s.flapPosition * 0.45) / s.spec.clSlope, 0, 0.22),
          vertical = clamp((1600 - s.position.y) * 0.08, -15, 25),
          pitch = alpha + Math.atan2(vertical, v);
        if (s.airborne && s.position.y > 100) {
          s.gear = false;
          s.flaps = false;
        }
        const input = {
          pitch: clamp((pitch - a.pitch) * 2, -0.4, 0.4),
          roll: clamp(-a.bank * 2, -0.4, 0.4),
          throttle: clamp((190 - s.speed) * 0.02, -1, 1),
        };
        stepAircraft(s, input, 1 / 120);
        updateTargets(x.targets, 1 / 120);
        x.w.update(s, x.targets, 1 / 120);
        x.m.update(s, x.targets, x.w, x.aim);
        events.push(...x.w.drainEvents());
      }
      const counts = {};
      for (const e of events) counts[e.type] = (counts[e.type] || 0) + 1;
      $('mode').value = 'battle';
      draw();
      $('report').textContent = JSON.stringify(
        {
          player: summary(x),
          phase: x.m.phase,
          objectives: x.m.objectives,
          events: counts,
          launches: events.filter((e) =>
            ['missile-launch', 'gun', 'bomb-release', 'ai-crash'].includes(e.type),
          ),
          units: x.targets.map((t) => ({
            id: t.id,
            type: t.type,
            alive: t.alive,
            pending: t.pending,
            health: t.health,
            position: t.position,
            service: t.service,
          })),
          cpuMs: performance.now() - start,
        },
        null,
        2,
      );
    };
    addEventListener('resize', () => {
      r.resize();
      draw();
    });
    await r.ready;
    draw();
  </script>
</html>
