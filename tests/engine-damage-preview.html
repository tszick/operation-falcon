<!doctype html>
<html lang="hu">
  <meta charset="utf-8" /><title>Hajtómű és szárny sérülési próba</title
  ><style>
    body {
      margin: 0;
      background: #071211;
      color: #b9eb8c;
      font:
        15px Consolas,
        monospace;
    }
    header {
      padding: 18px 24px;
    }
    button {
      background: #172b20;
      color: inherit;
      border: 1px solid #526d43;
      padding: 8px 15px;
      cursor: pointer;
    }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 24px;
    }
    article {
      border: 1px solid #2b4637;
      padding: 10px;
    }
    h2 {
      font-size: 17px;
      margin: 0;
    }
    p {
      font-size: 13px;
      margin: 6px 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 210px;
    }
  </style>
  <header>
    Operation Falcon: Redline · Sérülési modellpróba <button id="cpu">CPU nézet</button>
    <span id="backend"></span>
  </header>
  <main></main>
  <script type="module">
    import { Renderer } from '/src/renderer.js';
    import { aircraft } from '/src/aircraftSpec.js';
    import { createAircraft } from '/src/physics.js';
    import { ensureDamage, damageResponse } from '/src/damage.js';
    import { aircraftMesh } from '/src/airframes.js';
    import { Vec3, Quat } from '/src/math.js';
    const cases = [
      ['b52', false, 'B–52 · ép gép', 'Mind a nyolc hajtómű a szárnyon.'],
      [
        'b52',
        true,
        'B–52 · bal szárny leszakadt',
        'A négy bal oldali hajtómű is eltűnik a szárnnyal.',
      ],
      [
        'tu95',
        true,
        'Tu–95 · bal szárny leszakadt',
        'A gondolák és a légcsavarok is a szárnyhoz tartoznak.',
      ],
      [
        'a10',
        true,
        'A–10 · bal szárny leszakadt',
        'A törzsre szerelt két motor megmarad. A szárny pilonjai leválnak.',
      ],
    ];
    let cpu = false;
    const scenes = cases.map(([id, sever, title, description]) => {
      const panel = document.createElement('article');
      panel.innerHTML = `<h2>${title}</h2><p>${description}</p><canvas></canvas><p class="power"></p>`;
      document.querySelector('main').append(panel);
      const canvas = panel.querySelector('canvas'),
        r = new Renderer(canvas),
        s = createAircraft(aircraft.find((a) => a.id === id));
      ensureDamage(s);
      if (sever) s.condition.parts.leftWing = 0.08;
      const response = damageResponse(s);
      panel.querySelector('.power').textContent =
        `Működő hajtóművek: ${response.engines.operating}/${response.engines.count} · rendelkezésre álló tolóerő: ${Math.round(response.engine * 100)}%`;
      return { r, s, gpu: r.gpuModels, canvas };
    });
    function draw() {
      for (const { r, s, gpu, canvas } of scenes) {
        r.gpuModels = cpu ? null : gpu;
        const box = canvas.getBoundingClientRect(),
          d = Math.min(devicePixelRatio || 1, 2);
        r.w = box.width;
        r.h = box.height;
        r.focal = r.h * 1.9;
        canvas.width = r.w * d;
        canvas.height = r.h * d;
        r.ctx.setTransform(d, 0, 0, d, 0, 0);
        r.ctx.fillStyle = '#091a12';
        r.ctx.fillRect(0, 0, r.w, r.h);
        const camera = new Vec3(45, 32, 60).scale(aircraftMesh(s.spec.id).radius / 35),
          direction = camera.clone().scale(-1);
        r.setup(
          camera,
          Quat.euler(
            Math.atan2(direction.x, direction.z),
            Math.atan2(direction.y, Math.hypot(direction.x, direction.z)),
            0,
          ),
        );
        r.worldOcclusion = false;
        r.meshQueue = [];
        r.mesh(aircraftMesh(s.spec.id), new Vec3(), new Quat(), 1, '#b9eb8c', s.condition);
        r.flushMeshes();
      }
      document.querySelector('#backend').textContent = cpu
        ? 'CPU tartalék rajzoló'
        : scenes.every((s) => s.gpu)
          ? 'WebGL2'
          : 'WebGL2 nem érhető el';
    }
    document.querySelector('#cpu').onclick = () => {
      cpu = !cpu;
      document.querySelector('#cpu').textContent = cpu ? 'WebGL2 nézet' : 'CPU nézet';
      draw();
    };
    addEventListener('resize', draw);
    draw();
  </script>
</html>
