<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <title>Elterelők és fékszárny próba</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      #demo {
        position: fixed;
        top: 170px;
        left: 29%;
        width: 40%;
        z-index: 10;
        background: #081610e8;
        border: 1px solid #729553;
        padding: 8px;
        font: 10px/1.5 monospace;
        color: #c9ec9d;
      }
      #demo button {
        font: 10px monospace;
        background: #24391e;
        border: 1px solid #729553;
        color: #c9ec9d;
        padding: 7px;
        margin: 2px;
      }
      #demo-result {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="demo">
      <button id="flaps">Fékszárny mozgatása</button><button id="ir">Infrarakéta próba</button
      ><button id="radar-test">Radarrakéta próba</button
      ><button id="release">Vegyes elterelő</button><button id="stop">Szünet</button
      ><span id="demo-result"></span>
    </div>
    <script type="module">
      import { aircraft, missions } from '/src/aircraftSpec.js';
      import { Vec3, Quat } from '/src/math.js';
      import { createAircraft, stepAircraft, STEP } from '/src/physics.js';
      import { Weapons } from '/src/weapons.js';
      import { Targeting } from '/src/targeting.js';
      import { Renderer } from '/src/renderer.js';
      import { Mission } from '/src/mission.js';
      import { updateHUD } from '/src/hud.js';
      import { toggleActuator } from '/src/damage.js';
      import { deployCountermeasures } from '/src/countermeasures.js';
      import { weaponProfiles } from '/src/weaponDynamics.js';
      const source = new DOMParser().parseFromString(await (await fetch('/')).text(), 'text/html');
      for (const selector of ['#world', 'header', '#flight-ui'])
        document.body.append(source.querySelector(selector));
      document.body.classList.add('flying');
      document.getElementById('flight-ui').hidden = false;
      document.getElementById('fuel-status').hidden = false;
      document.getElementById('phase-guide').hidden = true;
      document.getElementById('open-guide').hidden = true;
      const renderer = new Renderer(document.getElementById('world')),
        aim = new Targeting();
      renderer.thirdPerson = true;
      let s,
        w,
        paused = true,
        message = '',
        last = performance.now(),
        acc = 0,
        timeLeft = 0;
      function reset() {
        s = createAircraft(aircraft.find((a) => a.id === 'f16'));
        s.onGround = false;
        s.airborne = true;
        s.position = new Vec3(0, 500, 0);
        s.velocity = new Vec3(0, 0, 180);
        s.orientation = Quat.euler(0, 0.04, 0);
        s.gear = false;
        s.flaps = false;
        s.flapPosition = 0;
        s.throttle = 0.6;
        s.speed = s.ias = 180;
        s.agl = 500;
        s.landingMode = 'off';
        w = new Weapons({ random: () => 0.3 });
        paused = true;
        timeLeft = 0;
        acc = 0;
        message = '';
      }
      function flip() {
        message = toggleActuator(s, 'flaps') || 'Fékszárny mozgatása';
        paused = false;
        timeLeft = 2.1;
      }
      function release() {
        message = deployCountermeasures(s).message;
        paused = false;
        timeLeft = Math.max(timeLeft, 4);
      }
      function incoming(profile) {
        reset();
        w.projectiles.push({
          id: 1,
          owner: 'enemy',
          type: 'aam',
          profile,
          position: new Vec3(0, 500, -1500),
          velocity: new Vec3(0, 0, 260),
          age: 0,
          damage: 50,
          travelled: 0,
          trailTimer: 0,
          trailAnchor: new Vec3(0, 500, -1500),
        });
        paused = false;
        timeLeft = 12;
        message = 'C / vegyes elterelő: védekezés';
      }
      document.getElementById('flaps').onclick = flip;
      document.getElementById('config-flaps').onclick = flip;
      document.getElementById('release').onclick = release;
      document.getElementById('config-countermeasures').onclick = release;
      document.getElementById('ir').onclick = () => incoming(weaponProfiles.defense);
      document.getElementById('radar-test').onclick = () => incoming(weaponProfiles.sam);
      document.getElementById('stop').onclick = () => (paused = !paused);
      addEventListener('keydown', (e) => {
        if (e.repeat) return;
        if (e.code === 'KeyC') release();
        if (e.code === 'KeyX') flip();
      });
      addEventListener('resize', () => renderer.resize());
      function frame(now) {
        const dt = Math.min(0.1, (now - last) / 1000);
        last = now;
        if (!paused) {
          acc += dt;
          while (acc >= STEP) {
            stepAircraft(s, {}, STEP);
            w.update(s, [], STEP);
            w.drainEvents();
            acc -= STEP;
            timeLeft -= STEP;
          }
          if (timeLeft <= 0) paused = true;
        }
        const m = new Mission(missions[1]);
        m.update(s, [], w, aim);
        updateHUD(s, [], w, aim, m, true);
        renderer.render(s, [], w, aim);
        document.getElementById('demo-result').textContent =
          `${message} · ${paused ? 'SZÜNET' : 'FUT'} · sérülés ${Math.round(s.damage)}% · aktív csalik ${s.countermeasures.decoys.length} · elterelt rakéta ${w.projectiles.filter((p) => p.decoyId !== undefined).length}`;
        requestAnimationFrame(frame);
      }
      reset();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
