<!doctype html><html lang="hu"><meta charset="utf-8"><title>Fegyvereffektek – hang és látvány ellenőrzése</title><style>body{background:#071211;color:#bbf475;font:13px monospace;margin:24px}button{padding:10px 16px;margin:6px;background:#13271a;color:inherit;border:1px solid #527442;font:inherit;cursor:pointer}canvas{display:block;width:100%;height:480px;margin-top:20px;border:1px solid #38513b}pre{white-space:pre-wrap}</style><h1>Fegyvereffektek</h1><div id="buttons"></div><pre id="checks">Hangszint ellenőrzése…</pre><canvas id="scene"></canvas><script type="module">
import {AudioSystem} from '/src/audio.js';import {Weapons} from '/src/weapons.js';import {Renderer} from '/src/renderer.js';import {createAircraft} from '/src/physics.js';import {aircraft} from '/src/aircraftSpec.js';import {Quat,Vec3} from '/src/math.js';import {Targeting} from '/src/targeting.js';
const s=createAircraft(aircraft.find(a=>a.id==='f16'));s.position=new Vec3(0,350,0);s.velocity=new Vec3(0,0,160);s.onGround=false;s.airborne=true;s.speed=160;s.ias=155;s.agl=350;s.orientation=Quat.euler(0,0,0);s.gear=false;s.flaps=false;
const samples=[['Ágyúsorozat',{type:'gun',position:s.position.clone()}],['Rakétaindítás',{type:'missile-launch',position:s.position.clone()}],['Bombakioldás',{type:'bomb-release',position:s.position.clone()}],['Közeli robbanás',{type:'explosion',position:s.position.clone().add(new Vec3(30,0,150)),ground:false}],['Távoli földi robbanás',{type:'explosion',position:s.position.clone().add(new Vec3(1200,-350,2200)),ground:true,heavy:true}]];
const audio=new AudioSystem();for(const[name,event]of samples){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{audio.start();audio.playEvent(event,s);};document.getElementById('buttons').append(b);}
const results=[];for(const[name,event]of samples){const a=new AudioSystem();a.ctx=new OfflineAudioContext(2,48000*6,48000);a.createEffectsBus();a.playEvent(event,s);const buffer=await a.ctx.startRendering();let peak=0,sum=0;for(let channel=0;channel<2;channel++)for(const value of buffer.getChannelData(channel)){peak=Math.max(peak,Math.abs(value));sum+=value*value;}const ok=peak>.00001&&peak<.35&&Number.isFinite(sum);results.push(`${ok?'OK':'HIBA'} · ${name}: peak=${peak.toFixed(4)}, RMS=${Math.sqrt(sum/(buffer.length*2)).toFixed(5)}`);if(!ok)throw new Error('Audio level check: '+name);}document.getElementById('checks').textContent=results.join('\n');
const canvas=document.getElementById('scene'),r=new Renderer(canvas);r.w=1200;r.h=480;canvas.width=1200;canvas.height=480;r.ctx.setTransform(1,0,0,1,0,0);r.focal=384;r.thirdPerson=true;
const weapons=new Weapons(),target={id:'T',kind:'air',alive:true,radius:28,position:new Vec3(0,350,650),velocity:new Vec3()};weapons.fire(s,[target],{id:'T',locked:true});for(let i=0;i<42;i++)weapons.update(s,[target],1/120);weapons.explode(new Vec3(55,355,350),'aam',{target});for(let i=0;i<24;i++)weapons.update(s,[],1/120);weapons.explode(new Vec3(-80,330,430),'bomb',{ground:true});for(let i=0;i<110;i++)weapons.update(s,[],1/120);weapons.explode(new Vec3(30,360,330),'aam',{target});for(let i=0;i<15;i++)weapons.update(s,[],1/120);r.render(s,[],weapons,new Targeting());
</script></html>
