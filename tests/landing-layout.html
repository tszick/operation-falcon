<!doctype html><html lang="hu"><head><meta charset="utf-8"><title>Leszállási kijelző ellenőrzése</title><link rel="stylesheet" href="/style.css"></head><body><script type="module">
import {aircraft,missions} from '/src/aircraftSpec.js';
import {createAircraft} from '/src/physics.js';
import {Vec3,Quat,DEG} from '/src/math.js';
import {approachSpeeds} from '/src/performance.js';
import {evaluateApproach} from '/src/landing.js';
import {updateHUD} from '/src/hud.js';
import {Renderer} from '/src/renderer.js';
import {Weapons} from '/src/weapons.js';
import {Targeting} from '/src/targeting.js';
import {Mission} from '/src/mission.js';
const source=new DOMParser().parseFromString(await(await fetch('/')).text(),'text/html');
for(const selector of ['#world','header','#flight-ui'])document.body.append(source.querySelector(selector));
document.getElementById('flight-ui').hidden=false;document.getElementById('fuel-status').hidden=false;document.body.classList.add('flying','guide-open');
const s=createAircraft(aircraft.find(a=>a.id==='f16'));s.onGround=false;s.airborne=true;s.position=new Vec3(15,107,-3600);s.orientation=Quat.euler(0,3*DEG,0);s.ias=approachSpeeds(s).target/3.6;s.speed=s.ias;s.velocity=new Vec3(0,-s.ias*Math.tan(3*DEG),s.ias);s.agl=107;s.approach=evaluateApproach(s);s.throttle=.25;
const w=new Weapons(),aim=new Targeting(),m=new Mission(missions[1]);m.destroyed=true;m.update(s,[],w,aim);updateHUD(s,[],w,aim,m,true);const r=new Renderer(document.getElementById('world'));r.render(s,[],w,aim);
</script></body></html>
