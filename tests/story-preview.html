<!doctype html><html lang="hu"><meta charset="utf-8"><title>Story #1 · látványpróba</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/flight.css"><body><script type="module">
import {aircraft,missions} from '/src/aircraftSpec.js';import {createMissionAircraft} from '/src/missionStart.js';import {createTargets,updateTargets,Targeting} from '/src/targeting.js';import {Renderer} from '/src/renderer.js';import {Vec3,Quat} from '/src/math.js';import {Mission} from '/src/mission.js';import {Weapons} from '/src/weapons.js';import {updateHUD} from '/src/hud.js';
const query=new URLSearchParams(location.search),scenario=missions.find(m=>m.id===(query.get('scene')==='ballistic'?'ballistic':'defend-city')),spec=aircraft.find(a=>a.id==='f16');
const source=new DOMParser().parseFromString(await(await fetch('/')).text(),'text/html');for(const selector of ['#world','header','#flight-ui'])document.body.append(source.querySelector(selector));document.getElementById('flight-ui').hidden=false;document.body.classList.add('flying','guide-open');
const targets=createTargets(scenario,spec,{rng:()=>.23}),s=createMissionAircraft(spec,scenario),m=new Mission(scenario),w=new Weapons(),aim=new Targeting();Object.assign(s,{onGround:false,airborne:true,gear:false,flaps:false,flapPosition:0,position:new Vec3(0,550,13500),velocity:new Vec3(0,0,180),orientation:Quat.euler(0,-.1,0),elapsed:120,speed:180,ias:180,agl:550});
if(scenario.id==='ballistic'){s.elapsed=300;m.update(s,targets,w,aim);updateTargets(targets,1);const rocket=targets.find(t=>t.type==='ballistic');s.position=rocket.position.clone().add(new Vec3(0,0,-900));s.orientation=Quat.euler(0,0,0);aim.id=rocket.id;aim.locked=true;aim.progress=spec.lockTime;}
m.update(s,targets,w,aim);updateHUD(s,targets,w,aim,m,true);new Renderer(document.getElementById('world')).render(s,targets,w,aim);
</script></body></html>
