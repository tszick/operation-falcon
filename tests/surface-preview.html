<!doctype html>
<html lang="hu">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width" /><title>
    Operation Falcon · Felületkísérlet</title
  ><style>
    body {
      overflow: hidden;
      margin: 0;
      background: #071211;
      color: #d7edc5;
      font: 14px system-ui;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    aside {
      position: fixed;
      top: 12px;
      left: 14px;
      padding: 12px 16px;
      background: #071211eb;
      border: 1px solid #456145;
      max-width: 650px;
    }
    select,
    button,
    a {
      font: inherit;
      color: #d7edc5;
      background: #1b3228;
      border: 1px solid #55704d;
      padding: 6px;
      margin: 3px;
    }
    pre {
      white-space: pre-wrap;
      font-size: 12px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 8px;
    }
    small {
      display: block;
      color: #c1c9bd;
    }</style
  ><canvas id="world"></canvas>
  <aside>
    <h1>Operation Falcon: Redline · Felületkísérlet</h1>
    <label
      >Látvány
      <select id="style"></select></label
    ><label
      >Jelenet
      <select id="scene">
        <option value="flight">Táj és légi kötelék</option>
        <option value="hangar">Hangár és földi egységek</option>
        <option value="models">Gépek és katonai járművek</option>
        <option value="busy">Sok gép és város</option>
        <option value="high">Nagy magasság</option>
      </select></label
    ><button id="benchmark">Tájváltozatok összehasonlítása</button><a href="/">Játék</a
    ><small>Hang nélkül, álló tesztjelenet · a játék fizikáját nem módosítja.</small>
    <pre id="status">Betöltés…</pre>
    <pre id="report"></pre>
  </aside>
  <script type="module">
    import { Renderer } from '/src/renderer.js';
    import { surfaceStyles } from '/src/surfaceStyle.js';
    import { aircraft, missions } from '/src/aircraftSpec.js';
    import { createAircraft } from '/src/physics.js';
    import { createTargets, Targeting } from '/src/targeting.js';
    import { Vec3, Quat } from '/src/math.js';
    import { Weapons } from '/src/weapons.js';
    import { homeHangars } from '/src/terrain.js';
    const $ = (id) => document.getElementById(id),
      r = new Renderer($('world')),
      s = createAircraft(aircraft.find((a) => a.id === 'f16')),
      targets = createTargets(
        missions.find((m) => m.id === 'airbase'),
        s.spec,
        { rng: () => 0.3 },
      ),
      w = new Weapons(),
      aim = new Targeting();
    r.debugMetrics = true;
    $('style').innerHTML = Object.entries(surfaceStyles)
      .map(([k, v]) => `<option value="${k}">${v.label}</option>`)
      .join('');
    $('style').value = 'grass';
    r.surfaceMode = 'grass';
    r.surfaceLines = false;
    s.onGround = false;
    s.airborne = true;
    s.gear = false;
    s.flaps = false;
    s.flapPosition = 0;
    s.speed = s.ias = 180;
    s.velocity = new Vec3(0, 0, 180);
    // Close presentation-only models share the actual renderer and mesh/material paths.
    const extras = [
      {
        id: 'PREVIEW-AIR',
        kind: 'air',
        type: 'fighter',
        aircraftId: 'f16',
        team: 'ally',
        alive: true,
        position: new Vec3(25, 205, -315),
        velocity: new Vec3(0, 0, 180),
        heading: 0,
      },
      {
        id: 'PREVIEW-SAM',
        kind: 'ground',
        type: 'sam-system',
        team: 'enemy',
        alive: true,
        position: new Vec3(90, 0, -420),
        velocity: new Vec3(),
        heading: 0.4,
      },
    ];
    const stressUnits = [
      ...Array.from({ length: 32 }, (_, i) => ({
        id: 'STRESS-A' + i,
        kind: 'air',
        type: 'fighter',
        aircraftId: i % 2 ? 'mig29' : 'f16',
        team: i % 2 ? 'enemy' : 'ally',
        alive: true,
        position: new Vec3(
          ((i % 8) - 3.5) * 110,
          850 + (i % 3) * 40,
          100 + Math.floor(i / 8) * 220,
        ),
        velocity: new Vec3(0, 0, 180),
        heading: i * 0.1,
      })),
      ...Array.from({ length: 25 }, (_, i) => ({
        id: 'STRESS-B' + i,
        kind: 'ground',
        type: 'city-building',
        city: true,
        team: 'ally',
        alive: true,
        position: new Vec3(((i % 5) - 2) * 600, 0, 2200 + Math.floor(i / 5) * 600),
        velocity: new Vec3(),
        buildingHeight: 200 + (i % 4) * 140,
        buildingWidth: 80,
        buildingDepth: 80,
      })),
    ];
    function pose() {
      if ($('scene').value === 'busy') {
        s.position = new Vec3(0, 900, -380);
        s.orientation = Quat.euler(0, -0.12, 0);
      } else if ($('scene').value === 'models') {
        s.position = new Vec3(0, 26, -510);
        s.orientation = Quat.euler(0.2, -0.04, 0);
        extras[0].position = new Vec3(8, 27, -450);
        extras[1].position = new Vec3(25, 0, -420);
      } else if ($('scene').value === 'high') {
        s.position = new Vec3(12000, 9000, -3000);
        s.orientation = Quat.euler(0.4, -0.6, 0);
      } else if ($('scene').value === 'hangar') {
        const h = homeHangars[0];
        s.position = new Vec3(h.x + 80, 36, h.z - 130);
        s.orientation = Quat.euler(Math.atan2(-80, 130), -0.12, 0);
      } else {
        s.position = new Vec3(0, 210, -380);
        s.orientation = Quat.euler(0.15, -0.1, 0);
      }
      s.agl = s.position.y;
    }
    pose();
    $('style').onchange = () => {
      r.surfaceMode = $('style').value;
      r.surfaceLines = r.surfaceMode === 'vector';
    };
    $('scene').onchange = pose;
    addEventListener('resize', () => r.resize());
    let run = null;
    $('benchmark').onclick = () => {
      run = {
        ids: Object.keys(surfaceStyles),
        index: 0,
        frames: 0,
        submit: [],
        interval: [],
        results: [],
        previous: 0,
        restore: r.surfaceMode,
      };
      $('benchmark').disabled = true;
      $('report').textContent = 'Mérés…';
    };
    function frame(now) {
      if (run) {
        r.surfaceMode = run.ids[run.index];
        r.surfaceLines = r.surfaceMode === 'vector';
      }
      const start = performance.now();
      r.render(
        s,
        [...targets, ...extras, ...($('scene').value === 'busy' ? stressUnits : [])],
        w,
        aim,
      );
      const submit = performance.now() - start;
      $('status').textContent =
        `${surfaceStyles[r.surfaceMode].label} · modellek: ${r.modelMetrics?.backend || 'Canvas2D'} · terep: ${r.terrainMetrics?.backend || 'Canvas2D'}
${r.modelMetrics?.triangles || 0} modellháromszög · ${r.terrainMetrics?.triangles || 0} terepháromszög`;
      if (run) {
        if (run.frames >= 30) {
          run.submit.push(submit);
          run.interval.push(now - run.previous);
        }
        run.previous = now;
        if (++run.frames >= 100) {
          const avg = (a) => +(a.reduce((s, v) => s + v, 0) / a.length).toFixed(2),
            p95 = (a) =>
              +a
                .slice()
                .sort((a, b) => a - b)
                [Math.floor(a.length * 0.95)].toFixed(2);
          run.results.push({
            mode: r.surfaceMode,
            frames: run.submit.length,
            submitMeanMs: avg(run.submit),
            submitP95Ms: p95(run.submit),
            frameMeanMs: avg(run.interval),
            frameP95Ms: p95(run.interval),
          });
          $('report').textContent = JSON.stringify(
            {
              viewport: [r.w, r.h],
              modelBackend: r.modelMetrics?.backend,
              terrainBackend: r.terrainMetrics?.backend,
              results: run.results,
            },
            null,
            2,
          );
          if (++run.index === run.ids.length) {
            r.surfaceMode = run.restore;
            run = null;
            $('benchmark').disabled = false;
          } else {
            run.frames = 0;
            run.submit = [];
            run.interval = [];
          }
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</html>
