<!doctype html>
<html lang="hu">
  <meta charset="utf-8" /><title>Operation Falcon · Tengeri kabinpróba</title
  ><link rel="stylesheet" href="/style.css" /><link rel="stylesheet" href="/flight.css" /><style>
    #naval-test-controls {
      position: fixed;
      z-index: 1000;
      top: 55px;
      left: 12px;
      background: #091a22ee;
      padding: 8px;
      font: 12px monospace;
    }
    #naval-test-controls select,
    #naval-test-controls button {
      background: #19323c;
      color: white;
      border: 1px solid #759195;
      padding: 5px;
    }
  </style>
  <body>
    <script type="module">
      const template = new DOMParser().parseFromString(
        await (await fetch('/index.html')).text(),
        'text/html',
      );
      template.querySelectorAll('script').forEach((n) => n.remove());
      document.body.append(...template.body.childNodes);
      document.getElementById('hangar').hidden = true;
      document.getElementById('hangar-footer').hidden = true;
      document.getElementById('flight-ui').hidden = false;
      document.getElementById('overlay').hidden = true;
      document.body.classList.add('flying', 'guide-open');
      const controls = document.createElement('aside');
      controls.id = 'naval-test-controls';
      controls.innerHTML =
        '<strong>TENGERI KABIN · HANG NÉLKÜL</strong> <select disabled id="naval-mode" aria-label="Fedélzeti jelenet"><option value="battle">F/A-18 a fedélzeten</option><option value="trap">F/A-18 megközelítés</option><option value="harrier-light">Harrier a fedélzeten</option><option value="harrier-land">Harrier megközelítés</option></select> <button disabled id="naval-step">8 s repülési próba</button> <span id="naval-test-status"></span>';
      document.body.append(controls);
      const { navalScenario, advanceNaval } = await import('./navalScenarios.js'),
        { Renderer } = await import('/src/renderer.js'),
        { updateHUD } = await import('/src/hud.js'),
        { evaluateApproach } = await import('/src/landing.js');
      const $ = (id) => document.getElementById(id),
        r = new Renderer($('world'));
      r.surfaceMode = 'ocean';
      r.surfaceLines = false;
      let x = navalScenario();
      function draw() {
        x.s.approach = evaluateApproach(x.s);
        x.m.update(x.s, x.targets, x.w, x.aim);
        r.render(x.s, x.targets, x.w, x.aim);
        updateHUD(x.s, x.targets, x.w, x.aim, x.m, true);
        $('naval-test-status').textContent = x.m.phase;
      }
      $('naval-mode').onchange = () => {
        x = navalScenario($('naval-mode').value);
        draw();
      };
      $('naval-step').onclick = () => {
        advanceNaval(x, 8, { combat: false });
        draw();
      };
      addEventListener('resize', () => {
        r.resize();
        draw();
      });
      draw();
      $('naval-mode').disabled = false;
      $('naval-step').disabled = false;
    </script>
  </body>
</html>
