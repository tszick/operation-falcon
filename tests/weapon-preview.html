<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <title>Fegyverek és üzemanyag ellenőrzése</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      #test-controls {
        position: fixed;
        bottom: 100px;
        left: 29%;
        width: 42%;
        z-index: 10;
        background: #071211ed;
        padding: 8px;
        border: 1px solid #729553;
      }
      #test-controls button {
        background: #1d331e;
        color: #c9ec9d;
        border: 1px solid #729553;
        padding: 6px;
        font: 10px monospace;
        margin: 2px;
      }
      #test-result {
        display: block;
        color: #c9ec9d;
        font: 10px/1.6 monospace;
        margin: 5px;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <div id="test-controls">
      <button id="short">AIM-9M · 15 km</button><button id="long">AIM-120C · 15 km</button
      ><button id="gun-far">Gépágyú · 15 km</button><button id="gun-near">Gépágyú · 700 m</button
      ><button id="dry">60 mp teljes gáz</button><button id="wet">60 mp utánégető</button
      ><button id="empty">Tank kiürülése</button><span id="test-result"></span>
    </div>
    <script type="module">
      import { aircraft, missions } from '/src/aircraftSpec.js';
      import { createAircraft, stepAircraft, STEP } from '/src/physics.js';
      import { Vec3, Quat } from '/src/math.js';
      import { updateHUD } from '/src/hud.js';
      import { Renderer } from '/src/renderer.js';
      import { Weapons } from '/src/weapons.js';
      import { Targeting } from '/src/targeting.js';
      import { Mission } from '/src/mission.js';
      import { fuelFlow, consumeFuel } from '/src/fuel.js';
      const source = new DOMParser().parseFromString(await (await fetch('/')).text(), 'text/html');
      for (const selector of ['#world', 'header', '#flight-ui'])
        document.body.append(source.querySelector(selector));
      document.getElementById('flight-ui').hidden = false;
      document.getElementById('fuel-status').hidden = false;
      document.getElementById('phase-guide').hidden = true;
      document.getElementById('open-guide').hidden = true;
      document.body.classList.add('flying');
      const renderer = new Renderer(document.getElementById('world'));
      let s, w, aim, targets;
      function reset(id = 'f16', distance = 15000, type = 'aam') {
        s = createAircraft(aircraft.find((a) => a.id === id));
        s.onGround = false;
        s.airborne = true;
        s.gear = s.flaps = false;
        s.position = new Vec3(0, 1500, 0);
        s.velocity = new Vec3(0, 0, 180);
        s.orientation = new Quat();
        s.speed = s.ias = 180;
        s.agl = 1500;
        s.throttle = 1;
        s.landingMode = 'off';
        w = new Weapons();
        w.selected = type;
        aim = new Targeting();
        aim.id = 'T';
        aim.locked = true;
        aim.progress = 2;
        targets = [
          {
            id: 'T',
            kind: 'air',
            type: 'fighter',
            alive: true,
            name: 'Próbacél',
            aircraftId: 'mig29',
            radius: 28,
            position: new Vec3(0, 1500, distance),
            velocity: new Vec3(),
            heading: Math.PI,
          },
        ];
      }
      function draw(message = '') {
        const m = new Mission(missions[1]);
        m.update(s, targets, w, aim);
        updateHUD(s, targets, w, aim, m, true);
        renderer.render(s, targets, w, aim);
        document.getElementById('test-result').textContent =
          `${message}\nÜzemanyag: ${s.fuel.toFixed(1)} kg · fogyasztás ${((s.fuelFlow || 0) * 60).toFixed(1)} kg/perc\n${w.solution?.label || ''} · ${w.solution?.detail || ''}`;
      }
      document.getElementById('short').onclick = () => {
        reset();
        draw();
      };
      document.getElementById('long').onclick = () => {
        reset('f22');
        draw();
      };
      document.getElementById('gun-far').onclick = () => {
        reset('f16', 15000, 'gun');
        draw();
      };
      document.getElementById('gun-near').onclick = () => {
        reset('f16', 700, 'gun');
        draw();
      };
      for (const [id, ab] of [
        ['dry', false],
        ['wet', true],
      ])
        document.getElementById(id).onclick = () => {
          reset();
          const flow = fuelFlow(s, {
            thrust: ab ? s.spec.abThrust : s.spec.thrust,
            afterburner: ab,
          });
          s.afterburner = ab;
          for (let i = 0; i < 7200; i++) consumeFuel(s, flow, STEP);
          draw('60 másodperc fogyasztása, azonos földközeli hajtóműpróbán');
        };
      document.getElementById('empty').onclick = () => {
        reset();
        s.fuel = 0.05;
        s.afterburner = true;
        for (let i = 0; i < 120; i++) stepAircraft(s, {});
        draw(
          `Hajtómű: ${s.enginePower === 0 ? 'LEÁLLT' : 'JÁR'} · utánégető: ${s.afterburner ? 'BE' : 'KI'}`,
        );
      };
      reset();
      draw();
    </script>
  </body>
</html>
