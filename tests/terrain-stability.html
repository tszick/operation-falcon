<!doctype html>
<html lang="hu">
  <meta charset="utf-8" /><title>Terep stabilitása</title
  ><style>
    body {
      margin: 0;
      overflow: hidden;
      background: #071211;
      color: #d7efc0;
      font: 14px monospace;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    aside {
      position: fixed;
      top: 16px;
      left: 16px;
      background: #071211ed;
      padding: 14px;
      max-width: 630px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 8px;
    }
    button {
      background: #183025;
      color: #d7efc0;
      border: 1px solid #6c9355;
      padding: 8px;
    }
    pre {
      white-space: pre-wrap;
    }</style
  ><canvas id="world"></canvas>
  <aside>
    <h1>Távoli hegycsúcs · hálóváltás ellenőrzése</h1>
    <button id="before">A: határ előtt</button> <button id="after">B: határ után</button>
    <pre id="status"></pre>
    <p>
      A két helyzet között 20 m valódi kameramozgás van.<br />A rögzített jelölő ugyanannak a
      hegycsúcsnak a világhelyét mutatja.
    </p>
  </aside>
  <script type="module">
    import { Renderer } from '/src/renderer.js';
    import { aircraft } from '/src/aircraftSpec.js';
    import { createAircraft } from '/src/physics.js';
    import { Vec3, Quat } from '/src/math.js';
    import { configureTerrain, terrainWorld, terrainHeight } from '/src/terrain.js';
    import { Weapons } from '/src/weapons.js';
    import { Targeting } from '/src/targeting.js';
    configureTerrain({ id: 'none' }, new Vec3(22000, 0, 0), () => 0.99);
    const peak = { x: 27250, z: 23030, height: 2100, radius: 2200, platform: 0 };
    terrainWorld.peaks.push(peak);
    const s = createAircraft(aircraft.find((a) => a.id === 'f16')),
      r = new Renderer(document.getElementById('world')),
      w = new Weapons(),
      aim = new Targeting();
    r.surfaceMode = 'grass';
    s.gear = false;
    s.flaps = false;
    s.flapPosition = 0;
    s.onGround = false;
    s.airborne = true;
    s.ias = s.speed = 180;
    s.velocity = new Vec3(0, 0, 180);
    s.agl = 1200;
    s.orientation = Quat.euler(Math.atan2(peak.x, peak.z), 0, 0);
    const summit = new Vec3(peak.x, terrainHeight(peak.x, peak.z), peak.z);
    function draw(x) {
      s.position = new Vec3(x, 1200, 0);
      r.render(s, [], w, aim);
      r.markerLabels = [];
      r.marker(summit, 'RÖGZÍTETT HEGYCSÚCS', '#ffd493');
      const sampled = r.terrainSurface
        .flatMap((f) => f.points)
        .find((p) => p.x === peak.x && p.z === peak.z);
      document.getElementById('status').textContent =
        `Kamera X: ${x} m · terepháló középpontja: ${r.terrainGridCenter.x} m
Hegycsúcs világhelye: ${summit.x}, ${summit.y.toFixed(1)}, ${summit.z} m
A háló csúcspontja: ${sampled ? sampled.x + ', ' + sampled.y.toFixed(1) + ', ' + sampled.z : 'NINCS – HIBA'}`;
    }
    document.getElementById('before').onclick = () => draw(330);
    document.getElementById('after').onclick = () => draw(350);
    addEventListener('resize', () => {
      r.resize();
      draw(s.position.x);
    });
    draw(0);
    draw(330);
  </script>
</html>
